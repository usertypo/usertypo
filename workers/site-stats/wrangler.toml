# usertypo_ Site Stats Worker — guest aggregates + merged About-page stats.
# Deploy dev:  npm run worker:site-stats:deploy:dev

name = "usertypo-site-stats-dev"
main = "src/index.ts"
compatibility_date = "2026-07-27"

[durable_objects]
bindings = [
  { name = "SITE_STATS", class_name = "SiteStatsHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteStatsHub"]

[vars]
ENVIRONMENT = "dev"
ALLOWED_ORIGINS = "https://dev.usertypo.com,https://dev.usertypo.pages.dev,http://localhost:3000,http://127.0.0.1:3000"
SIGNED_IN_CACHE_MS = "60000"

