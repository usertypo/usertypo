services:
  - type: web
    name: usertypo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:pages
    startCommand: npm start
    healthCheckPath: /health-check
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Set to "true" only AFTER https://usertypo.com is live on Cloudflare Pages.
      # Until then keep "false" so https://usertypo.onrender.com still works during cutover.
      - key: BACKEND_ONLY
        value: "false"
      - key: PUBLIC_SITE_URL
        value: https://usertypo.com
      - key: ALLOWED_ORIGINS
        value: https://usertypo.com,https://www.usertypo.com,https://usertypo.pages.dev
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://usertypo.com,https://www.usertypo.com,https://usertypo.pages.dev
      - key: SELF_PING_ENABLED
        value: "true"
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://skebosepedaxnvcaizka.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
