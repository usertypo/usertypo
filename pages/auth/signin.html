            <a href="/privacy" data-spa-link class="hover:text-primary transition-colors">Privacy</a>
            <span class="text-slate-700">·</span>
            <a href="https://x.com/usertypo_" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors">Twitter</a>
            <span class="text-slate-700">·</span>
            <span class="text-slate-500">v1.0.0</span>
        </div>
        <div class="flex items-center gap-2 text-[9px] text-slate-600 font-mono">
            <span class="material-symbols-outlined text-[12px]">palette</span>
            <span>Themes and Languages</span>
            <button type="button" data-footer-picker
                class="footer-pill glass-panel bg-surface/85 !backdrop-blur-sm border border-white/10 px-1.5 py-0 rounded-full text-[8px] leading-4 text-slate-400 hover:text-white transition-colors cursor-pointer">usertypo_, English 10k</button>
        </div>
    </footer>

<script>
const __pageAbort = new AbortController();
const __pageSignal = __pageAbort.signal;

window.__spaPageInit = function() {
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const indicator = document.getElementById('pill-indicator');
    const authStage = document.getElementById('auth-stage');
    const brandSide = document.getElementById('brand-side');
    const formSide = document.getElementById('form-side');
    const signinPanel = document.getElementById('signin-panel');
    const signupPanel = document.getElementById('signup-panel');
    const goToSignup = document.getElementById('go-to-signup');
    const goToSignin = document.getElementById('go-to-signin');

    if (!tabSignin || !tabSignup || !indicator || !authStage || !brandSide || !formSide) return;

    function updateIndicator(btn) {
        if (!btn) return;
        indicator.style.left = btn.offsetLeft + 'px';
        indicator.style.width = btn.offsetWidth + 'px';
    }
    updateIndicator(tabSignin);

    let currentMode = 'signin';
    let switching = false;

    function switchTo(mode) {
        if (mode === currentMode || switching) return;
        switching = true;

        brandSide.classList.add('fading-out');
        formSide.classList.add('fading-out');

        setTimeout(() => {
            currentMode = mode;

            if (mode === 'signup') {
                authStage.classList.add('show-signup');
                signinPanel.style.display = 'none';
                signupPanel.style.display = 'flex';
                tabSignup.classList.add('active');
                tabSignin.classList.remove('active');
                updateIndicator(tabSignup);
            } else {
                authStage.classList.remove('show-signup');
                signinPanel.style.display = 'flex';
                signupPanel.style.display = 'none';
                tabSignin.classList.add('active');
                tabSignup.classList.remove('active');
                updateIndicator(tabSignin);
            }

            const logoContainer = document.querySelector('.side-logo-container');
            if (logoContainer) {
                const newLogo = logoContainer.cloneNode(true);
                newLogo.style.setProperty('--typing-delay', '0.2s');
                newLogo.style.animation = 'none';
                newLogo.style.opacity = '1';
                logoContainer.parentNode.replaceChild(newLogo, logoContainer);
            }

            brandSide.classList.remove('fading-out');
            formSide.classList.remove('fading-out');
            switching = false;
        }, 510);
    }

    tabSignin.addEventListener('click', () => switchTo('signin'), { signal: __pageSignal });
    tabSignup.addEventListener('click', () => switchTo('signup'), { signal: __pageSignal });
    if (goToSignup) goToSignup.addEventListener('click', () => switchTo('signup'), { signal: __pageSignal });
    if (goToSignin) goToSignin.addEventListener('click', () => switchTo('signin'), { signal: __pageSignal });

    const authError = document.getElementById('auth-error');
    const signupError = document.getElementById('signup-error');
    const btnSignIn = document.getElementById('btn-signin-submit');
    const btnSignUp = document.getElementById('btn-signup-submit');
    const btnVerify = document.getElementById('btn-verify-submit');
    const btnSignInGoogle = document.getElementById('btn-signin-google');
    const btnSignUpGoogle = document.getElementById('btn-signup-google');
    const signupFields = document.getElementById('signup-fields');
    const verifyFields = document.getElementById('verify-fields');
    let authBusy = false;
    let awaitingVerification = false;

    function showError(el, message) {
        if (!el) return;
        if (!message) {
            el.textContent = '';
            el.classList.add('hidden');
            return;
        }
        el.textContent = message;
        el.classList.remove('hidden');
    }

    function setAuthBusy(isBusy) {
        authBusy = isBusy;
        [btnSignIn, btnSignUp, btnVerify, btnSignInGoogle, btnSignUpGoogle].forEach(function (btn) {
            if (btn) btn.disabled = isBusy;
        });
    }

    function resetSignupForm() {
        awaitingVerification = false;
        if (signupFields) signupFields.classList.remove('hidden');
        if (verifyFields) verifyFields.classList.add('hidden');
        if (btnSignUp) btnSignUp.classList.remove('hidden');
        if (btnSignUpGoogle) btnSignUpGoogle.classList.remove('hidden');
        if (btnVerify) btnVerify.classList.add('hidden');
    }

    function showVerificationStep() {
        awaitingVerification = true;
        if (signupFields) signupFields.classList.add('hidden');
        if (verifyFields) verifyFields.classList.remove('hidden');
        if (btnSignUp) btnSignUp.classList.add('hidden');
        if (btnSignUpGoogle) btnSignUpGoogle.classList.add('hidden');
        if (btnVerify) btnVerify.classList.remove('hidden');
    }

    function goHomeAfterAuth(welcomeKind) {
        if (welcomeKind && typeof window.usertypoSetAuthWelcome === 'function') {
            window.usertypoSetAuthWelcome(welcomeKind);
        }
        if (window.navigateTo) {
            window.navigateTo('/');
        } else {
            window.location.href = '/';
        }
    }

    async function initAuthPage() {
        if (!window.usertypoAuth) {
            showError(authError, 'Auth is not loaded. Refresh the page and try again.');
            return;
        }

        try {
            await window.usertypoAuth.ready();
            const state = window.usertypoAuth.getState();
            if (state.isSignedIn) {
                goHomeAfterAuth();
            }
        } catch (err) {
            showError(authError, window.usertypoAuth.formatError(err));
        }
    }

    async function handleSignIn() {
        if (authBusy || !window.usertypoAuth) return;
        showError(authError, '');

        const identifier = (document.getElementById('si-username')?.value || '').trim();
        const password = document.getElementById('si-password')?.value || '';

        if (!identifier || !password) {
            showError(authError, 'Enter your email/username and password.');
            return;
        }

        setAuthBusy(true);
        try {
            const result = await window.usertypoAuth.signInWithPassword(identifier, password);
            if (result.status === 'complete') {
                goHomeAfterAuth('back');
                return;
            }
            showError(authError, result.message || 'Sign in needs another step.');
        } catch (err) {
            showError(authError, window.usertypoAuth.formatError(err));
        } finally {
            setAuthBusy(false);
        }
    }

    async function handleSignUp() {
        if (authBusy || !window.usertypoAuth) return;
        showError(signupError, '');
        resetSignupForm();

        const username = (document.getElementById('su-username')?.value || '').trim();
        const email = (document.getElementById('su-email')?.value || '').trim();
        const password = document.getElementById('su-password')?.value || '';
        const verify = document.getElementById('su-verify')?.value || '';

        if (!username || !email || !password || !verify) {
            showError(signupError, 'Fill in all sign-up fields.');
            return;
        }
        if (username.length < 4) {
            showError(signupError, 'Username must be at least 4 characters.');
            return;
        }
        if (password !== verify) {
            showError(signupError, 'Passwords do not match.');
            return;
        }

        setAuthBusy(true);
        try {
            const result = await window.usertypoAuth.signUpWithPassword({ username, email, password });
            if (result.status === 'complete') {
                goHomeAfterAuth('new');
                return;
            }
            if (result.status === 'needs_email_verification') {
                showError(signupError, '');
                showVerificationStep();
                return;
            }
            showError(signupError, result.message || 'Could not create your account.');
        } catch (err) {
            const msg = window.usertypoAuth.formatError(err);
            if (/username is not a valid parameter/i.test(msg)) {
                showError(
                    signupError,
                    'Username is not enabled in Clerk yet. Open the Clerk Dashboard → User & authentication → Username, turn it on, then try again.'
                );
            } else {
                showError(signupError, msg);
            }
        } finally {
            setAuthBusy(false);
        }
    }

    async function handleVerifyEmail() {
        if (authBusy || !window.usertypoAuth) return;
        showError(signupError, '');

        const code = (document.getElementById('su-verify-code')?.value || '').trim();
        if (!code) {
            showError(signupError, 'Enter the verification code from your email.');
            return;
        }

        setAuthBusy(true);
        try {
            const result = await window.usertypoAuth.verifyEmailCode(code);
            if (result.status === 'complete') {
                goHomeAfterAuth('new');
                return;
            }
            showError(signupError, result.message || 'Verification failed. Try again.');
        } catch (err) {
            showError(signupError, window.usertypoAuth.formatError(err));
        } finally {
            setAuthBusy(false);
        }
    }

    async function handleGoogleSignIn() {
        if (authBusy || !window.usertypoAuth) return;
        showError(authError, '');
        showError(signupError, '');
        setAuthBusy(true);
        try {
            await window.usertypoAuth.signInWithGoogle();
        } catch (err) {
            showError(authError, window.usertypoAuth.formatError(err));
            setAuthBusy(false);
        }
    }

    async function handleGoogleSignUp() {
        if (authBusy || !window.usertypoAuth) return;
        showError(authError, '');
        showError(signupError, '');
        setAuthBusy(true);
        try {
            if (typeof window.usertypoAuth.signUpWithGoogle === 'function') {
                await window.usertypoAuth.signUpWithGoogle();
            } else {
                await window.usertypoAuth.signInWithGoogle();
            }
        } catch (err) {
            showError(signupError, window.usertypoAuth.formatError(err));
            setAuthBusy(false);
        }
    }

    if (btnSignIn) btnSignIn.addEventListener('click', handleSignIn, { signal: __pageSignal });
    if (btnSignUp) btnSignUp.addEventListener('click', handleSignUp, { signal: __pageSignal });
    if (btnVerify) btnVerify.addEventListener('click', handleVerifyEmail, { signal: __pageSignal });
    if (btnSignInGoogle) btnSignInGoogle.addEventListener('click', handleGoogleSignIn, { signal: __pageSignal });
    if (btnSignUpGoogle) btnSignUpGoogle.addEventListener('click', handleGoogleSignUp, { signal: __pageSignal });

    document.getElementById('si-password')?.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleSignIn();
    }, { signal: __pageSignal });
    document.getElementById('su-verify')?.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !awaitingVerification) handleSignUp();
    }, { signal: __pageSignal });
    document.getElementById('su-verify-code')?.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleVerifyEmail();
    }, { signal: __pageSignal });

    initAuthPage();

    document.querySelectorAll('.btn-primary').forEach(btn => {
        btn.addEventListener('click', function (e) {
            const r = document.createElement('span');
            const rc = btn.getBoundingClientRect();
            const sz = Math.max(rc.width, rc.height);
            r.style.cssText = `position:absolute;border-radius:50%;
                    width:${sz}px;height:${sz}px;
                    left:${e.clientX - rc.left - sz / 2}px;top:${e.clientY - rc.top - sz / 2}px;
                    background:rgba(255,255,255,.18);transform:scale(0);
                    animation:rippleOut .55s linear;pointer-events:none;`;
            btn.appendChild(r);
            setTimeout(() => r.remove(), 560);
        }, { signal: __pageSignal });
    });

    const observer = new MutationObserver(() => {
        updateIndicator(document.querySelector('.tab-pill button.active'));
    });
    observer.observe(authStage, { childList: true, subtree: true, attributes: true });
    __pageAbort.signal.addEventListener('abort', () => observer.disconnect(), { once: true });

    const viewTrack = document.getElementById('view-scroll-track');
    const viewThumb = document.getElementById('view-scroll-thumb');
    const formSideWrapper = document.getElementById('form-side-wrapper');
    let isDragging = false;
    let startY;
    let startScrollTop;

    if (viewTrack && viewThumb && formSideWrapper && formSide) {
        document.addEventListener('mousemove', (e) => {
            const rect = formSideWrapper.getBoundingClientRect();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const inVerticalBounds = mouseY >= rect.top && mouseY <= rect.bottom;
            const inHorizontalBounds = mouseX >= rect.right - 50 && mouseX <= rect.right + 40;

            if (isDragging || (inVerticalBounds && inHorizontalBounds)) {
                viewTrack.classList.remove('opacity-0', 'translate-x-4', 'pointer-events-none');
                viewTrack.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');
            } else {
                viewTrack.classList.add('opacity-0', 'translate-x-4', 'pointer-events-none');
                viewTrack.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
            }
        }, { signal: __pageSignal });

        function updateViewScrollbar() {
            const scrollHeight = formSide.scrollHeight;
            const clientHeight = formSide.clientHeight;
            const scrollableDistance = scrollHeight - clientHeight;

            if (scrollableDistance <= 0) {
                viewTrack.style.display = 'none';
                return;
            }
            viewTrack.style.display = 'block';

            const scrollPercentage = formSide.scrollTop / scrollableDistance;
            const trackHeight = viewTrack.clientHeight;
            const viewportRatio = clientHeight / scrollHeight;
            const thumbHeight = Math.max(trackHeight * viewportRatio, 40);
            viewThumb.style.height = `${thumbHeight}px`;

            const maxThumbTop = trackHeight - thumbHeight;
            viewThumb.style.top = `${scrollPercentage * maxThumbTop}px`;
        }

        formSide.addEventListener('scroll', updateViewScrollbar, { signal: __pageSignal });
        window.addEventListener('resize', updateViewScrollbar, { signal: __pageSignal });

        viewThumb.addEventListener('mousedown', (e) => {
            isDragging = true;
            startY = e.clientY;
            startScrollTop = formSide.scrollTop;
            document.body.style.userSelect = 'none';
            viewThumb.classList.add('bg-primary');
        }, { signal: __pageSignal });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const scrollHeight = formSide.scrollHeight;
            const clientHeight = formSide.clientHeight;
            const maxScroll = scrollHeight - clientHeight;
            const maxThumbTop = viewTrack.clientHeight - viewThumb.clientHeight;
            const deltaY = e.clientY - startY;
            const scrollRatio = deltaY / maxThumbTop;
            formSide.scrollTop = startScrollTop + (scrollRatio * maxScroll);
            updateViewScrollbar();
        }, { signal: __pageSignal });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                document.body.style.userSelect = '';
                viewThumb.classList.remove('bg-primary');
            }
        }, { signal: __pageSignal });

        setTimeout(updateViewScrollbar, 200);
        const scrollObserver = new MutationObserver(updateViewScrollbar);
        scrollObserver.observe(formSide, { childList: true, subtree: true, attributes: true });
        __pageAbort.signal.addEventListener('abort', () => scrollObserver.disconnect(), { once: true });
    }

    window.scrollTo(0, 0);
};

var __prevSpaCleanup = window.__spaPageCleanup;
window.__spaPageCleanup = function() {
    __pageAbort.abort();
    document.body.style.userSelect = '';
    if (typeof __prevSpaCleanup === 'function') __prevSpaCleanup();
};
</script>
