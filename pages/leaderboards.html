            const pageTrack = document.getElementById('page-scroll-track');
            const pageThumb = document.getElementById('page-scroll-thumb');
            let isDragging = false, startY, startScrollTop;

            function updatePageScrollbar() {
                const docH = document.documentElement.scrollHeight;
                const winH = window.innerHeight;
                const scrollable = docH - winH;
                if (scrollable <= 0) { pageTrack.style.display = 'none'; return; }
                pageTrack.style.display = 'block';
                const pct = window.scrollY / scrollable;
                const trackH = pageTrack.clientHeight;
                const thumbH = Math.max(trackH * (winH / docH), 40);
                pageThumb.style.height = thumbH + 'px';
                pageThumb.style.top = (pct * (trackH - thumbH)) + 'px';

            document.addEventListener('mousemove', e => {
                if (isDragging || window.innerWidth - e.clientX < 40) {

                const maxThumbTop = pageTrack.clientHeight - thumbH;

                window.scrollTo(0, startScrollTop + (deltaY / maxThumbTop) * maxScroll);
            });
            document.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                document.body.style.userSelect = '';
                pageThumb.classList.remove('bg-primary');
            });
