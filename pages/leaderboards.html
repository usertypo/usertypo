<script>
// --- SPA lifecycle (auto-injected) ---
const __pageAbort = new AbortController();
const __pageSignal = __pageAbort.signal;
const __pageTimers = [];
const __origDocAEL = document.addEventListener.bind(document);
const __origWinAEL = window.addEventListener.bind(window);
const __origSetInterval = window.setInterval.bind(window);
const __origSetTimeout = window.setTimeout.bind(window);
const __origClearInterval = window.clearInterval.bind(window);
const __origClearTimeout = window.clearTimeout.bind(window);
function __spaMergeSignal(options) {
    if (options && typeof options === 'object') {
        if (options.signal) return options;
        return Object.assign({}, options, { signal: __pageSignal });
    }
    if (typeof options === 'boolean') return { capture: options, signal: __pageSignal };
    return { signal: __pageSignal };
}
document.addEventListener = function(type, listener, options) {
    return __origDocAEL(type, listener, __spaMergeSignal(options));
};
window.addEventListener = function(type, listener, options) {
    return __origWinAEL(type, listener, __spaMergeSignal(options));
};
window.setInterval = function(handler, timeout) {
    const id = __origSetInterval(handler, timeout);
    __pageTimers.push({ kind: 'interval', id: id });
    return id;
};
window.setTimeout = function(handler, timeout) {
    const id = __origSetTimeout(handler, timeout);
    __pageTimers.push({ kind: 'timeout', id: id });
    return id;
};

window.__spaPageInit = function() {
            var lbState = {
                scope: 'global',
                timeframe: 'daily',
                amount: 30,
            };
            var lbRequestId = 0;

            function getCurrentUserId() {
                if (!window.usertypoAuth) return null;
                try {
                    var state = window.usertypoAuth.getState();
                    return state.isSignedIn && state.user ? state.user.id : null;
                } catch (e) {
                    return null;
                }
            }

            function setStatus(text) {
                var el = document.getElementById('lb-status');
                if (el) el.textContent = text;
            }

            function renderAvatar(entry, colorClass, isMe) {
                if (window.usertypoPlayerAvatar) {
                    return window.usertypoPlayerAvatar.fromPlayer({
                        avatarUrl: entry.avatarUrl,
                        name: entry.username,
                        level: entry.level,
                        percentToNext: entry.percentToNext,
                        userId: entry.userId,
                    }, {
                        size: 'xs',
                        className: isMe ? 'shadow-[0_0_10px_rgba(0,208,255,0.45)]' : '',
                    });
                }
                var lb = window.usertypoLeaderboards;
                var letter = lb ? lb.initialFor(entry.username) : '?';
                if (entry.avatarUrl) {
                    return '<div class="w-7 h-7 rounded-full ' + colorClass + ' flex items-center justify-center overflow-hidden border border-transparent' + (isMe ? ' shadow-[0_0_10px_rgba(0,208,255,0.5)]' : '') + '">' +
                        '<img src="' + entry.avatarUrl + '" alt="" class="w-full h-full object-cover" loading="lazy" />' +
                        '</div>';
                }
                return '<div class="w-7 h-7 rounded-full ' + colorClass + ' flex items-center justify-center font-sans font-bold text-xs' + (isMe ? ' shadow-[0_0_10px_rgba(0,208,255,0.5)]' : ' border border-transparent group-hover:border-white/10 transition-colors') + '">' + letter + '</div>';
            }

            function renderLoading() {
                var tbody = document.getElementById('lb-tbody');
                if (!tbody) return;
                tbody.innerHTML = '<tr><td colspan="7" class="py-10 px-5 text-center text-slate-500 text-sm">Loading leaderboard...</td></tr>';
            }

            function renderMessage(message) {
                var tbody = document.getElementById('lb-tbody');
                if (!tbody) return;
                tbody.innerHTML = '<tr><td colspan="7" class="py-10 px-5 text-center text-slate-500 text-sm">' + message + '</td></tr>';
            }

            function renderTable(entries, myUserId) {
                var tbody = document.getElementById('lb-tbody');
                var lb = window.usertypoLeaderboards;
                if (!tbody || !lb) return;

                if (!entries.length) {
                    renderMessage('No scores yet for this filter. Complete a timed test to appear here.');
                    return;
                }

                tbody.innerHTML = entries.map(function (entry, index) {
                    var isMe = !!(myUserId && entry.userId === myUserId);
                    var colorClass = isMe ? 'bg-primary text-background-dark' : lb.colorClassForIndex(index);
                    var rank = lb.formatRank(entry.rank);
                    var wpm = lb.formatWpm ? lb.formatWpm(entry.wpm) : String(Math.round(entry.wpm));
                    var raw = lb.formatWpm ? lb.formatWpm(entry.rawWpm) : '—';
                    var acc = lb.formatAccuracy(entry.accuracy);
                    var cons = lb.formatConsistency ? lb.formatConsistency(entry.consistency) : lb.formatAccuracy(entry.consistency);
                    var date = lb.formatRelativeTime(entry.createdAt);

                    if (isMe) {
                        return '<tr class="bg-primary/10 border-l-4 border-l-primary hover:bg-primary/20 transition-colors shadow-[inset_0_0_20px_rgba(0,208,255,0.05)]">' +
                            '<td class="py-2.5 px-5 font-bold text-primary">' + rank + '</td>' +
                            '<td class="py-2.5 px-5"><div class="flex items-center gap-3">' +
                            renderAvatar(entry, colorClass, true) +
                            '<span class="font-sans font-bold text-white tracking-wide">' + entry.username + '</span>' +
                            '<span class="material-symbols-outlined text-primary text-sm" title="You">person</span>' +
                            '</div></td>' +
                            '<td class="py-2.5 px-5 text-right font-bold text-white text-base">' + wpm + '</td>' +
                            '<td class="py-2.5 px-4 text-right text-white/80 hidden md:table-cell">' + raw + '</td>' +
                            '<td class="py-2.5 px-5 text-right text-white font-medium">' + acc + '</td>' +
                            '<td class="py-2.5 px-4 text-right text-white/80 hidden md:table-cell">' + cons + '</td>' +
                            '<td class="py-2.5 px-5 text-right text-primary/70 hidden sm:table-cell">' + date + '</td>' +
                            '</tr>';
                    }

                    return '<tr class="hover:bg-white/5 transition-colors group border-l-4 border-transparent">' +
                        '<td class="py-2.5 px-5 text-slate-400">' + rank + '</td>' +
                        '<td class="py-2.5 px-5"><div class="flex items-center gap-3">' +
                        renderAvatar(entry, colorClass, false) +
                        '<span class="font-sans font-medium text-slate-200 group-hover:text-white transition-colors">' + entry.username + '</span>' +
                        '</div></td>' +
                        '<td class="py-2.5 px-5 text-right font-bold text-primary/80">' + wpm + '</td>' +
                        '<td class="py-2.5 px-4 text-right text-slate-400 hidden md:table-cell">' + raw + '</td>' +
                        '<td class="py-2.5 px-5 text-right text-slate-300">' + acc + '</td>' +
                        '<td class="py-2.5 px-4 text-right text-slate-400 hidden md:table-cell">' + cons + '</td>' +
                        '<td class="py-2.5 px-5 text-right text-slate-500 hidden sm:table-cell">' + date + '</td>' +
                        '</tr>';
                }).join('');
            }

            async function loadLeaderboard() {
                if (!window.usertypoLeaderboards) {
                    renderMessage('Leaderboard module is not loaded.');
                    return;
                }

                if (lbState.scope !== 'global') {
                    setStatus(lbState.scope === 'country' ? 'Country leaderboards are coming soon.' : 'Friends leaderboards are coming soon.');
                    renderMessage('This leaderboard view is coming soon. Switch back to Global for now.');
                    return;
                }

                var reqId = ++lbRequestId;
                setStatus('Loading leaderboard...');
                renderLoading();

                try {
                    if (window.usertypoAuth && typeof window.usertypoAuth.ready === 'function') {
                        await window.usertypoAuth.ready();
                    }

                    var result = await window.usertypoLeaderboards.getLeaderboard({
                        mode: 'time',
                        amount: lbState.amount,
                        timeframe: lbState.timeframe,
                        limit: 50,
                    });

                    if (reqId !== lbRequestId) return;

                    var labels = {
                        daily: 'Daily',
                        weekly: 'Weekly',
                        alltime: 'All-time',
                    };
                    setStatus((labels[lbState.timeframe] || 'All-time') + ' timed ' + lbState.amount + 's leaderboard');
                    renderTable(result.entries, getCurrentUserId());
                } catch (err) {
                    if (reqId !== lbRequestId) return;
                    console.error('[usertypo leaderboards] load failed', err);
                    setStatus('Could not load leaderboard.');
                    renderMessage('Could not load leaderboard. Please refresh and try again.');
                }
            }

            loadLeaderboard();

            // Ã¢â€â‚¬Ã¢â€â‚¬ CONFIG BAR Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
            const configBar = document.getElementById('config-bar');

            // Flash-open on page load (matches index behaviour)
            if (configBar) {
                configBar.classList.add('is-open');
                setTimeout(() => { configBar.classList.remove('is-open'); }, 2000);
            }

            // Config bar: only enable clicks after expansion animation finishes
            const innerConfigContent = document.getElementById('inner-config-content');
            let configExpandTimer = null;
            if (configBar) {
                configBar.addEventListener('mouseenter', () => {
                    clearTimeout(configExpandTimer);
                    configExpandTimer = setTimeout(() => {
                        if (innerConfigContent) innerConfigContent.style.pointerEvents = 'auto';
                    }, 500);
                });
                configBar.addEventListener('mouseleave', () => {
                    clearTimeout(configExpandTimer);
                    if (innerConfigContent) innerConfigContent.style.pointerEvents = 'none';
                });
            }

            function setActive(selector, clickedEl) {
                document.querySelectorAll(selector).forEach(b => {
                    b.classList.remove('text-primary', 'font-bold');
                    b.classList.add('text-slate-400');
                    b.querySelectorAll('.drop-shadow-\\[0_0_5px_rgba\\(0\\,208\\,255\\,0\\.4\\)\\]').forEach(s => s.classList.remove('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]'));
                });
                clickedEl.classList.add('text-primary', 'font-bold');
                clickedEl.classList.remove('text-slate-400');
            }
            function setScope(v, el) {
                setActive('.is-scope', el);
                lbState.scope = v;
                loadLeaderboard();
            }
            function setTime(v, el) {
                setActive('.is-time', el);
                lbState.timeframe = v;
                loadLeaderboard();
            }
            function setDur(v, el) {
                setActive('.is-dur', el);
                lbState.amount = Number(v) || 30;
                loadLeaderboard();
            }

            window.setScope = setScope;
