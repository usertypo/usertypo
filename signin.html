        #auth-stage {

            justify-content: center;
            gap: 12rem;
            width: 100%;
            max-width: 1300px;
            padding: 0 2rem;
        }

        /* The "brand" side (logo + welcome) */
        #brand-side {
            display: flex;
            flex-direction: column;

            gap: 1.25rem;
            flex: 1;
            max-width: 440px;
        }

        #form-side-wrapper {

        .field-wrap {
            position: relative;

        .field-wrap input {
            width: 100%;

            font-family: 'Inter', sans-serif;
            color: #e2e8f0;

        }
        .field-wrap input:focus ~ label,
        .field-wrap input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: .85rem;
            color: #00d0ff;
        }
        /* Animated underline bar */
        .field-wrap::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background: #00d0ff;
            box-shadow: 0 0 8px rgba(0,208,255,.6);
            transition: width .3s ease, left .3s ease;
        }
        .field-wrap:focus-within::after {
            width: 100%;
            left: 0;

    <!-- Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â JAVASCRIPT Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* Ã¢â€â‚¬Ã¢â€â‚¬ Sidebar Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
            const openMenuBtn = document.getElementById('open-menu-btn');
            const sidebarMenu = document.getElementById('sidebar-menu');
            if (openMenuBtn && sidebarMenu) {
                openMenuBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    sidebarMenu.classList.remove('-translate-x-full');
                    sidebarMenu.classList.add('translate-x-0');
                    openMenuBtn.classList.add('is-active', 'opacity-0', 'pointer-events-none');
                });
                sidebarMenu.addEventListener('mouseleave', () => {
                    sidebarMenu.classList.remove('translate-x-0');
                    sidebarMenu.classList.add('-translate-x-full');
                    openMenuBtn.classList.remove('is-active', 'opacity-0', 'pointer-events-none');
                    openMenuBtn.blur();
                });
            }

            /* Ã¢â€â‚¬Ã¢â€â‚¬ Pill indicator Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            const indicator = document.getElementById('pill-indicator');

            function updateIndicator(btn) {
                indicator.style.left = btn.offsetLeft + 'px';
                indicator.style.width = btn.offsetWidth + 'px';
            }
            // init
            updateIndicator(tabSignin);

            /* Ã¢â€â‚¬Ã¢â€â‚¬ State Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
            const authStage = document.getElementById('auth-stage');
            const brandSide = document.getElementById('brand-side');
            const formSide = document.getElementById('form-side');
            const signinPanel = document.getElementById('signin-panel');
            const signupPanel = document.getElementById('signup-panel');

            let currentMode = 'signin'; // 'signin' | 'signup'
            let switching = false;

            function switchTo(mode) {
                if (mode === currentMode || switching) return;
                switching = true;

                // Fade both sides out
                brandSide.classList.add('fading-out');
                formSide.classList.add('fading-out');

                setTimeout(() => {
                    // Swap content & layout
                    currentMode = mode;

                    if (mode === 'signup') {
                        authStage.classList.add('show-signup');
                        signinPanel.style.display = 'none';
                        signupPanel.style.display = 'flex';
                        tabSignup.classList.add('active');
                        tabSignin.classList.remove('active');
                        updateIndicator(tabSignup);
                    } else {
                        authStage.classList.remove('show-signup');
                        signinPanel.style.display = 'flex';
                        signupPanel.style.display = 'none';
                        tabSignin.classList.add('active');
                        tabSignup.classList.remove('active');
                        updateIndicator(tabSignin);
                    }

                    // Restart typing animation by cloning the container
                    const logoContainer = document.querySelector('.side-logo-container');
                    if(logoContainer) {
                        const newLogo = logoContainer.cloneNode(true);
                        newLogo.style.setProperty('--typing-delay', '0.2s');
                        newLogo.style.animation = 'none';
                        newLogo.style.opacity = '1';
                        logoContainer.parentNode.replaceChild(newLogo, logoContainer);
                    }

                    // Fade both sides back in
                    brandSide.classList.remove('fading-out');
                    formSide.classList.remove('fading-out');
                    switching = false;
                }, 510); // matches fade-target transition
            }

            /* Ã¢â€â‚¬Ã¢â€â‚¬ Pill clicks Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
            tabSignin.addEventListener('click', () => switchTo('signin'));
            tabSignup.addEventListener('click', () => switchTo('signup'));

            document.getElementById('go-to-signup').addEventListener('click', () => switchTo('signup'));
            document.getElementById('go-to-signin').addEventListener('click', () => switchTo('signin'));

            /* Ã¢â€â‚¬Ã¢â€â‚¬ Ripple on primary buttons Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
            document.querySelectorAll('.btn-primary').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    const r = document.createElement('span');
                    const rc = btn.getBoundingClientRect();
                    const sz = Math.max(rc.width, rc.height);
                    r.style.cssText = `position:absolute;border-radius:50%;
                    width:${sz}px;height:${sz}px;
                    left:${e.clientX - rc.left - sz / 2}px;top:${e.clientY - rc.top - sz / 2}px;
                    background:rgba(255,255,255,.18);transform:scale(0);
                    animation:rippleOut .55s linear;pointer-events:none;`;
                    btn.appendChild(r);
                    setTimeout(() => r.remove(), 560);
                });
            });

            // Trigger updating layout on switch
            const observer = new MutationObserver(() => {
                updateIndicator(document.querySelector('.tab-pill button.active'));
            });
            observer.observe(authStage, { childList: true, subtree: true, attributes: true });

            /* Ã¢â€â‚¬Ã¢â€â‚¬ VIEW-LEVEL CUSTOM SCROLLBAR (HOVER TO APPEAR) Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
            const viewTrack = document.getElementById('view-scroll-track');
            const viewThumb = document.getElementById('view-scroll-thumb');
            const formSideWrapper = document.getElementById('form-side-wrapper');
            let isDragging = false;
            let startY;
            let startScrollTop;

            // Slide in when mouse gets near the right edge of the form container (50px buffer inside, 40px outside to comfortably hold the external track)
            document.addEventListener('mousemove', (e) => {
                const rect = formSideWrapper.getBoundingClientRect();
                const mouseX = e.clientX;
                const mouseY = e.clientY;

                // Check if cursor is in the vertical range of the container
                const inVerticalBounds = mouseY >= rect.top && mouseY <= rect.bottom;
                // Check if cursor is near the right edge (within 50px inside to 40px outside right)
                const inHorizontalBounds = mouseX >= rect.right - 50 && mouseX <= rect.right + 40;

                if (isDragging || (inVerticalBounds && inHorizontalBounds)) {
                    viewTrack.classList.remove('opacity-0', 'translate-x-4', 'pointer-events-none');
                    viewTrack.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');
                } else {
                    viewTrack.classList.add('opacity-0', 'translate-x-4', 'pointer-events-none');
                    viewTrack.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
                }
            });

            // Sync thumb position and height with the actual scroll
            function updateViewScrollbar() {
                const scrollHeight = formSide.scrollHeight;
                const clientHeight = formSide.clientHeight;
                const scrollableDistance = scrollHeight - clientHeight;

                // Hide completely if there's nothing to scroll
                if (scrollableDistance <= 0) {
                    viewTrack.style.display = 'none';
                    return;
                } else {
                    viewTrack.style.display = 'block';
                }

                const scrollPercentage = formSide.scrollTop / scrollableDistance;
                const trackHeight = viewTrack.clientHeight;

                // Dynamically size thumb based on container height (minimum 40px)
                const viewportRatio = clientHeight / scrollHeight;
                let thumbHeight = Math.max(trackHeight * viewportRatio, 40);

                viewThumb.style.height = `${thumbHeight}px`;

                const maxThumbTop = trackHeight - thumbHeight;
                viewThumb.style.top = `${scrollPercentage * maxThumbTop}px`;
            }

            formSide.addEventListener('scroll', updateViewScrollbar);
            window.addEventListener('resize', updateViewScrollbar);

            // Drag-to-scroll functionality
            viewThumb.addEventListener('mousedown', (e) => {
                isDragging = true;
                startY = e.clientY;
                startScrollTop = formSide.scrollTop;
                document.body.style.userSelect = 'none';
                viewThumb.classList.add('bg-primary');
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const scrollHeight = formSide.scrollHeight;
                const clientHeight = formSide.clientHeight;
                const maxScroll = scrollHeight - clientHeight;
                const maxThumbTop = viewTrack.clientHeight - viewThumb.clientHeight;

                const deltaY = e.clientY - startY;
                const scrollRatio = deltaY / maxThumbTop;

                formSide.scrollTop = startScrollTop + (scrollRatio * maxScroll);
                updateViewScrollbar();
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.userSelect = '';
                    viewThumb.classList.remove('bg-primary');
                }
            });

            // Initialize position on load
            setTimeout(updateViewScrollbar, 200);
            new MutationObserver(updateViewScrollbar).observe(formSide, { childList: true, subtree: true, attributes: true });

        });
    </script>
</body>
